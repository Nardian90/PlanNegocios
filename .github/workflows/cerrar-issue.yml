name: Cierre del issue de prueba #1

# Workflow puntual: cierra el issue #1 (creado por accidente durante la
# verificación de permisos del token). Se elimina tras ejecutarse.
on:
  push:
    branches: [main]
    paths: [.github/workflows/cerrar-issue.yml]

permissions:
  issues: write

jobs:
  cerrar:
    runs-on: ubuntu-latest
    steps:
      - name: Comentar y cerrar el issue #1
        run: |
          set -e
          REPO="${{ github.repository }}"
          echo "--- comentario explicativo ---"
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/1/comments" \
            -d '{"body":"Issue creado por accidente durante la verificación de permisos del token; no describe ninguna tarea real. Se cierra sin acción. El trabajo de la misión AUDIT-001 quedó fusionado en main vía PR #2."}' \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "--- cierre del issue ---"
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/1" \
            -d '{"state":"closed","state_reason":"not_planned"}' \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "--- estado final ---"
          curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/1" \
            | grep -o '"state": *"[a-z]*"' | head -1
