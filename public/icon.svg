<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLANEX Cuba — icono de aplicación propio (misión UX-002 §3).

  Marca abstracta de la planificación de un proyecto con análisis financiero:
  un documento (el plan) sobre el que se levantan barras ascendentes (el
  análisis); la barra destacada en verde azulado señala el resultado que se
  proyecta. Formas simples y trazos gruesos para leerse a 16×16 píxeles,
  contraste alto sobre pestañas claras y oscuras, sin banderas ni símbolos
  políticos y sin imitar logotipos ajenos.

  La versión rasterizada (favicon.ico, PNG 16–512, apple-touch-icon) se genera
  con scripts/generar-icono-planex.py desde ESTA MISMA geometría.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PLANEX">
  <defs>
    <linearGradient id="px-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B" />
      <stop offset="1" stop-color="#115E59" />
    </linearGradient>
  </defs>
  <!-- Squircle de fondo con degradado pizarra → verde azulado -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#px-fondo)" />
  <!-- Filo interior sutil para pestañas oscuras -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#F8FAFC" stroke-opacity="0.16" stroke-width="1.5" />
  <!-- El documento: el plan de negocios -->
  <rect x="17" y="11" width="30" height="42" rx="4.5" fill="none" stroke="#F1F5F9" stroke-width="4" />
  <!-- El análisis financiero: barras ascendentes -->
  <rect x="24" y="35" width="5" height="10" rx="1.6" fill="#94A3B8" />
  <rect x="31" y="28" width="5" height="17" rx="1.6" fill="#E2E8F0" />
  <rect x="38" y="21" width="5" height="24" rx="1.6" fill="#2DD4BF" />
</svg>
