# ============================================================================
# PLANEX Cuba — Despliegue automático en GitHub Pages
#
# Cada push a la rama main construye el sitio estático (next build → out/) y
# lo publica en: https://nardian90.github.io/PlanNegocios/
#
# Requisitos (ya configurados):
#   - Repositorio → Settings → Pages → Source: "GitHub Actions"
#   - La aplicación es 100 % estática en su interfaz; la colaboración la
#     resuelve Supabase (Auth, PostgreSQL con RLS y Realtime) desde el
#     navegador, sin servidor propio.
#
# Variables de compilación (NO secretas: viajan al navegador compilado):
#   - NEXT_PUBLIC_SUPABASE_URL y NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
#     identificación del proyecto Supabase con la clave PUBLICABLE.
#     NUNCA poner aquí claves sb_secret_/service_role ni contraseñas.
#   - Correos internos de las cuentas de colaborador (los alias
#     «Colaborador1»/«Colaborador2» de la interfaz se resuelven a estos
#     correos para iniciar sesión con Supabase Auth).
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Proyecto Supabase (público: la clave publicable no es un secreto; los
  # datos quedan protegidos por autenticación y políticas RLS).
  NEXT_PUBLIC_SUPABASE_URL: https://huxxoiifdnmmrxcdxith.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9wEJACvdrcEYZ8T2-M86ng_8xmynW4A
  # Correos internos de los colaboradores (cuentas ya creadas en Supabase
  # Auth por la administración del proyecto).
  NEXT_PUBLIC_PLANEX_COLABORADOR1_EMAIL: colaborador1@planex.app
  NEXT_PUBLIC_PLANEX_COLABORADOR2_EMAIL: colaborador2@planex.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Construir sitio estático
        run: bun run build
        env:
          # GitHub Pages sirve el sitio bajo /PlanNegocios/
          NEXT_PUBLIC_BASE_PATH: /PlanNegocios

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
